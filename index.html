<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1F2E29">
<title>Roll Call — Attendance Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EEF2EE;
    --paper-line:#CBD5CD;
    --card:#FFFFFF;
    --ink:#1F2E29;
    --ink-soft:#54655D;
    --ink-faint:#8B9A91;
    --present:#2F6F4E;
    --present-bg:#E4EFE7;
    --absent:#A6402F;
    --absent-bg:#F5E5E1;
    --margin:#B4800E;
    --margin-bg:#F6EBD3;
    --line:#DCE2DC;
    --radius:16px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:
      repeating-linear-gradient(to bottom, transparent 0 31px, var(--paper-line) 31px 32px),
      var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:calc(120px + var(--safe-b));
  }
  .display{font-family:'Zilla Slab',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit; border:none; background:none; cursor:pointer; color:inherit;}
  input{font-family:inherit;}

  header.top{
    position:sticky; top:0; z-index:20;
    padding:calc(18px + var(--safe-t)) 20px 14px;
    background:linear-gradient(var(--paper) 82%, transparent);
  }
  .brand{display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .brand h1{font-size:22px; margin:0; letter-spacing:0.2px;}
  .brand .sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .overall{
    display:flex; align-items:center; gap:14px; margin-top:14px;
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 16px; box-shadow:0 1px 0 rgba(31,46,41,0.03);
  }
  .overall .stat-text{flex:1; min-width:0;}
  .overall .stat-num{font-size:20px; font-weight:700;}
  .overall .stat-label{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}

  main{padding:6px 20px 12px;}
  .section-label{
    font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--ink-faint);
    margin:18px 2px 8px;
  }

  .datebar{
    display:flex; align-items:center; gap:8px; background:var(--card);
    border:1px solid var(--line); border-radius:12px; padding:6px 8px; margin-bottom:10px;
  }
  .datebar button.arrow{
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    border-radius:9px; font-size:16px; color:var(--ink-soft);
  }
  .datebar button.arrow:active{background:var(--paper);}
  .datebar .datelabel{flex:1; text-align:center; font-size:14.5px; font-weight:600;}
  .datebar .datelabel .today-pill{
    display:none; font-size:10px; font-weight:600; color:var(--present);
    background:var(--present-bg); padding:1px 7px; border-radius:20px; margin-left:6px; vertical-align:1px;
  }
  .datebar.is-today .today-pill{display:inline-block;}
  .datebar input[type=date]{
    position:absolute; opacity:0; width:34px; height:34px; left:0; top:0;
  }
  .datebar .calwrap{position:relative; width:34px; height:34px;}

  .empty{
    text-align:center; padding:48px 20px; color:var(--ink-soft);
  }
  .empty .stampmark{margin:0 auto 14px;}
  .empty .go{
    margin-top:14px; display:inline-block; background:var(--ink); color:var(--paper);
    padding:10px 18px; border-radius:10px; font-weight:600; font-size:14px;
  }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:10px;
  }
  .subject-row .row1{display:flex; align-items:center; gap:12px;}
  .subject-row .namewrap{flex:1; min-width:0;}
  .subject-row .name{font-family:'Zilla Slab',serif; font-weight:600; font-size:16px; line-height:1.2;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .subject-row .frac{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .badge{
    font-size:11px; font-weight:600; padding:4px 9px; border-radius:20px; white-space:nowrap;
  }
  .badge.ok{color:var(--present); background:var(--present-bg);}
  .badge.warn{color:var(--margin); background:var(--margin-bg);}
  .badge.bad{color:var(--absent); background:var(--absent-bg);}
  .badge.neutral{color:var(--ink-soft); background:var(--paper);}

  .row2{display:flex; gap:8px; margin-top:10px;}
  .markbtn{
    flex:1; padding:11px 0; border-radius:10px; font-weight:600; font-size:13.5px;
    border:1.5px solid var(--line); color:var(--ink-soft); transition:transform .06s ease;
  }
  .markbtn:active{transform:scale(0.97);}
  .markbtn.present.active{background:var(--present); border-color:var(--present); color:#fff;}
  .markbtn.absent.active{background:var(--absent); border-color:var(--absent); color:#fff;}

  .stampmark{position:relative; width:52px; height:52px; flex:none;}
  .stampmark svg{width:100%; height:100%; display:block;}
  .stampmark .pct{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12.5px;
  }

  /* Subjects manage view */
  .subj-manage-row{display:flex; align-items:center; gap:10px;}
  .subj-manage-row .name{font-family:'Zilla Slab',serif; font-weight:600; font-size:15.5px;}
  .subj-manage-row .target{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .iconbtn{
    width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); font-size:15px; flex:none;
  }
  .iconbtn:active{background:var(--paper);}
  .iconbtn.danger{color:var(--absent);}

  .addform{
    background:var(--card); border:1px dashed var(--line); border-radius:var(--radius);
    padding:14px; margin-bottom:24px;
  }
  .addform .fields{display:flex; gap:8px;}
  .addform input[type=text]{
    flex:2; border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-size:14.5px; background:var(--paper);
  }
  .addform input[type=number]{
    flex:1; border:1px solid var(--line); border-radius:10px; padding:11px 10px; font-size:14.5px; background:var(--paper); width:0;
  }
  .addform .addbtn{
    margin-top:10px; width:100%; background:var(--ink); color:var(--paper); border-radius:10px;
    padding:12px 0; font-weight:600; font-size:14.5px;
  }
  .addform .addbtn:active{opacity:.85;}

  /* Tab bar */
  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:flex; justify-content:center; gap:6px;
    padding:10px 16px calc(10px + var(--safe-b));
    background:rgba(238,242,238,0.86); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
  }
  nav.tabbar button{
    flex:1; max-width:220px; padding:10px 0; border-radius:12px; font-weight:600; font-size:13.5px;
    color:var(--ink-soft); display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  nav.tabbar button .ic{font-size:17px;}
  nav.tabbar button.active{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(31,46,41,0.08);}

  /* banner */
  .banner{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 14px; margin-bottom:14px; font-size:13px; color:var(--ink-soft); position:relative;
  }
  .banner b{color:var(--ink);}
  .banner .x{position:absolute; top:8px; right:10px; font-size:16px; color:var(--ink-faint); padding:6px;}
  .banner ol{margin:8px 0 0; padding-left:18px;}
  .banner li{margin-bottom:2px;}

  /* modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(31,46,41,0.42); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-overlay.hidden{display:none;}
  .modal{
    background:var(--paper); width:100%; max-width:520px; border-radius:20px 20px 0 0;
    max-height:78vh; display:flex; flex-direction:column; padding-bottom:calc(16px + var(--safe-b));
    animation:slideup .18s ease-out;
  }
  @keyframes slideup{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0);
